name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout generator
        uses: actions/checkout@v7
        with:
          path: generator

      - name: Checkout generator core
        uses: actions/checkout@v7
        with:
          repository: php-skir/generator-core
          path: generator-core

      - name: Checkout runtime
        uses: actions/checkout@v7
        with:
          repository: php-skir/runtime
          path: runtime

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install generator core dependencies
        working-directory: generator-core
        run: npm ci

      - name: Build generator core
        working-directory: generator-core
        run: npm run build

      - name: Install dependencies
        working-directory: generator
        run: npm install --no-save ../generator-core

      - name: Typecheck
        working-directory: generator
        run: npm run typecheck

      - name: Build
        working-directory: generator
        run: npm run build

      - name: Validate package
        working-directory: generator
        run: npm run pack:dry-run

      - name: Run tests
        working-directory: generator
        run: npm test
        env:
          SKIR_RUNTIME_PATH: ${{ github.workspace }}/runtime

      - name: Publish
        working-directory: generator
        run: npm publish --provenance --access public
